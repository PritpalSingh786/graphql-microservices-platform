<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .loading {
            background: #ffc107;
            color: white;
        }

        .success {
            background: #4CAF50;
            color: white;
        }

        .error {
            background: #dc3545;
            color: white;
        }

        h1 {
            margin-bottom: 15px;
            color: #333;
        }

        .message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .user-info {
            display: none;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .user-info p {
            margin: 5px 0;
        }

        .user-info strong {
            color: #667eea;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="icon" class="icon loading">
        ⏳
    </div>

    <h1 id="title">
        Verifying Email...
    </h1>

    <div id="message" class="message">
        Please wait while we verify your email address.
    </div>

    <div id="userInfo" class="user-info">
        <p>Welcome, <strong>{{ user_id }}</strong></p>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    try {

        const response = await fetch("http://localhost:8000/graphql/auth/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                query: `
                    mutation VerifyEmail($userId: String!, $token: String!) {
                        verifyEmail(
                            userId: $userId,
                            token: $token
                        ) {
                            success
                            message
                        }
                    }
                `,
                variables: {
                    userId: "{{ user_id }}",
                    token: "{{ token }}"
                }
            })
        });

        const result = await response.json();

        if (result.errors) {

            document.getElementById("icon").className = "icon error";
            document.getElementById("icon").innerHTML = "❌";

            document.getElementById("title").innerHTML =
                "Verification Failed";

            document.getElementById("message").innerHTML =
                result.errors[0].message;

            return;
        }

        const data = result.data.verifyEmail;

        if (data.success) {

            document.getElementById("icon").className = "icon success";
            document.getElementById("icon").innerHTML = "✓";

            document.getElementById("title").innerHTML =
                "Email Verified! 🎉";

            document.getElementById("message").innerHTML =
                data.message || "Your email has been successfully verified.";

            document.getElementById("userInfo").style.display = "block";

        } else {

            document.getElementById("icon").className = "icon error";
            document.getElementById("icon").innerHTML = "❌";

            document.getElementById("title").innerHTML =
                "Verification Failed";

            document.getElementById("message").innerHTML =
                data.message;
        }

    } catch (error) {

        document.getElementById("icon").className = "icon error";
        document.getElementById("icon").innerHTML = "❌";

        document.getElementById("title").innerHTML =
            "Verification Failed";

        document.getElementById("message").innerHTML =
            "Something went wrong. Please try again.";
    }

});
</script>

</body>
</html>
