<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>

    <style>

        body{
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f4f4f4;
            font-family:Arial,sans-serif;
        }

        .card{
            background:white;
            padding:30px;
            width:450px;
            text-align:center;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
        }

        h2{
            color:red;
            margin-bottom:15px;
        }

        p{
            margin-bottom:20px;
        }

        a{
            text-decoration:none;
            background:#007bff;
            color:white;
            padding:10px 20px;
            border-radius:5px;
        }

        a:hover{
            background:#0056b3;
        }

    </style>

</head>
<body>

<div class="card">

    <h2>Link Invalid</h2>

    <p>
        {{ message }}
    </p>

</div>

</body>
</html>
