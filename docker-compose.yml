services:
  postgres_auth:
    image: postgres:15-alpine
    container_name: postgres_auth
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - microservices_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres_auth:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - microservices_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - microservices_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo_blog:
    image: mongo:7
    container_name: mongo_blog
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_blog_data:/data/db
    networks:
      - microservices_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile.auth
    container_name: auth_service
    environment:
      DEBUG: ${DEBUG}
      DB_HOST: postgres_auth
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./auth_service/.env
    volumes:
      - ./auth_service:/app
    ports:
      - "${AUTH_PORT}:8001"
    depends_on:
      postgres_auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microservices_network
    command: python manage.py runserver 0.0.0.0:8001
    # command: daphne -b 0.0.0.0 -p 8001 auth_service.asgi:application
    restart: unless-stopped

  celery_worker:
    build:
      context: ./auth_service
      dockerfile: Dockerfile.auth
    container_name: celery_worker
    environment:
      DEBUG: ${DEBUG}
      DB_HOST: postgres_auth
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./auth_service/.env
    volumes:
      - ./auth_service:/app
    depends_on:
      - redis
      - postgres_auth
    networks:
      - microservices_network
    command: celery -A auth_service worker --loglevel=info
    restart: unless-stopped

  blog_service:
    build:
      context: ./blog_service
      dockerfile: Dockerfile.blog
    container_name: blog_service
    environment:
      DEBUG: ${DEBUG}
      MONGO_HOST: mongo_blog
    env_file:
      - ./blog_service/.env
    volumes:
      - ./blog_service:/app
      - blog_media:/app/media
      # - ./blog_service/media:/app/media # for local folder
    ports:
      - "${BLOG_PORT}:8002"
    depends_on:
      mongo_blog:
        condition: service_healthy
    networks:
      - microservices_network
    command: python manage.py runserver 0.0.0.0:8002
    restart: unless-stopped

  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile.gateway
    container_name: api_gateway
    environment:
      DEBUG: ${DEBUG}
      AUTH_SERVICE_URL: http://auth_service:8001
      BLOG_SERVICE_URL: http://blog_service:8002
    env_file:
      - ./api_gateway/.env
    volumes:
      - ./api_gateway:/app
    ports:
      - "${GATEWAY_PORT}:8000"
    depends_on:
      - auth_service
      - blog_service
      - redis
    networks:
      - microservices_network
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped

networks:
  microservices_network:
    name: microservices_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_auth_data:
    name: postgres_auth_data
  pgadmin_data:
    name: pgadmin_data
  mongo_blog_data:
    name: mongo_blog_data
  blog_media:
    name: blog_media